services:
  # FastAPI backend — runs standalone with mock IMD data + the ML risk
  # model. MQTT/IoT gateway/simulator stay local-only (docker-compose);
  # they're not needed for the public dashboard to work.
  - type: web
    name: sanraksha-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/backend/data/sanraksha.db
      - key: USE_MOCK_IMD
        value: "true"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: SYNC_INTERVAL_MINUTES
        value: "30"
      - key: INGEST_TOKEN
        generateValue: true

  # React dashboard, built and served as a static site (free, no cold
  # starts). VITE_API_URL is wired automatically to the backend above.
  - type: web
    name: sanraksha-frontend
    env: static
    buildCommand: cd frontend/web-dashboard && npm ci && npm run build
    staticPublishPath: frontend/web-dashboard/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sanraksha-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
