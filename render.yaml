databases:
  - name: sanraksha-db
    plan: free

services:
  # FastAPI backend
  - type: web
    name: sanraksha-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sanraksha-db
          property: connectionString

      # Production must not silently turn missing live feeds into simulation.
      # Configure IMD_API_KEY in Render before relying on IMD rainfall.
      - key: USE_MOCK_IMD
        value: "false"

      - key: USE_MOCK_SATELLITE
        value: "false"

      - key: ENABLE_SCHEDULER
        value: "true"

      - key: SYNC_INTERVAL_MINUTES
        value: "30"

      - key: INGEST_TOKEN
        generateValue: true

      - key: ADMIN_API_KEY
        generateValue: true

  # React dashboard
  - type: web
    name: sanraksha-frontend
    env: static
    buildCommand: cd frontend/web-dashboard && npm ci && npm run build
    staticPublishPath: frontend/web-dashboard/dist
    envVars:
      - key: VITE_API_URL
        value: https://sanraksha-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
